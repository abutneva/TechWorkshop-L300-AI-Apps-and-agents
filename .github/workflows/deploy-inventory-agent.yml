name: Deploy Inventory Agent

on:
  push:
    paths:
      - 'src/app/agents/inventoryAgent_initializer.py'
      - 'src/prompts/InventoryAgentPrompt.txt'
      - 'src/app/tools/inventoryCheck.py'
      - 'src/app/agents/agent_processor.py'
      - 'src/app/agents/agent_initializer.py'
      - '.github/workflows/deploy-inventory-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secret
        shell: bash
        env:
          ENV: ${{ secrets.ENV }}
        run: |
          echo "$ENV" > src/.env

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r src/requirements.txt
          pip install "azure-ai-projects"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run Inventory Agent Initializer
        run: |
          cd src && python -u app/agents/inventoryAgent_initializer.py
